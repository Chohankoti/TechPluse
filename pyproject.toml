[project]
name = "techpulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chohan", email = "chohankoti333@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonc-parser>=1.1.5",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "tinyfish>=0.8.0",
]

[project.scripts]
techpulse = "techpulse:main"
techpulse-constraints = "techpulse.constraints_manager:run_app"
techpulse-eval = "techpulse.eval_engine:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build" 
